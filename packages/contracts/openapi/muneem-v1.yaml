openapi: 3.0.3
info:
  title: Muneem Cloud API
  version: 1.0.0
  description: |
    Stage 1 surface: identity, device registration, business setup, health. Stage 7 adds sync push, pull and bootstrap; Stage 8f adds encrypted backups and key escrow.
    Single source of truth for both the Go server (oapi-codegen) and the desktop client (openapi-typescript).
    Every response carries `X-Server-Time` (NFR-018). Every request from a registered device carries
    `X-Device-Id`, `X-Device-Timestamp`, `X-Device-Signature`, `X-App-Version`, `X-Schema-Version`,
    `X-Sync-Protocol`, `X-Request-Id`.

    Device signature: `X-Device-Timestamp` is **unix seconds** (server rejects skew > 5 min with
    DEVICE_CLOCK_SKEW). `X-Device-Signature` is base64(std) of an Ed25519 signature over the UTF-8 string
    `METHOD\nPATH\nTIMESTAMP\nsha256hex(body)` where PATH is the URL path including `/v1` and excluding the
    query string, and an absent body hashes the empty string. The device public key is the raw 32-byte
    Ed25519 key, base64(std).
servers:
  - url: https://api.muneem.app/v1
  - url: http://localhost:8080/v1
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      security: []
      tags: [system]
      responses:
        '200':
          description: OK
          headers:
            X-Server-Time:
              $ref: '#/components/headers/XServerTime'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /ready:
    get:
      operationId: getReady
      summary: Readiness — Postgres and object storage answer (load balancers and deploys gate on it; /health is liveness)
      security: []
      tags: [system]
      responses:
        '200':
          description: Ready to serve
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: A dependency did not answer in time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
  /auth/register:
    post:
      operationId: register
      security: []
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /auth/login:
    post:
      operationId: login
      security: []
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /auth/refresh:
    post:
      operationId: refresh
      security: []
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/Error'
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Logged out
  /me:
    get:
      operationId: getMe
      tags: [auth]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Error'
  /devices/register:
    post:
      operationId: registerDevice
      tags: [devices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRegisterRequest'
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '200':
          description: Already registered (idempotent on installation_id)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '402':
          $ref: '#/components/responses/Error'
  /devices:
    get:
      operationId: listDevices
      tags: [devices]
      parameters:
        - $ref: '#/components/parameters/BusinessId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'
  /devices/{deviceId}/revoke:
    post:
      operationId: revokeDevice
      tags: [devices]
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '404':
          $ref: '#/components/responses/Error'
  /businesses:
    get:
      operationId: listBusinesses
      tags: [business]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Business'
    post:
      operationId: createBusiness
      tags: [business]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Business'
        '200':
          description: Already exists (idempotent on client id)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Business'
        '422':
          $ref: '#/components/responses/Error'
  /businesses/{businessId}:
    parameters:
      - $ref: '#/components/parameters/BusinessIdPath'
    get:
      operationId: getBusiness
      tags: [business]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Business'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateBusiness
      tags: [business]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Business'
        '409':
          $ref: '#/components/responses/Error'
  /businesses/{businessId}/branches:
    parameters:
      - $ref: '#/components/parameters/BusinessIdPath'
    get:
      operationId: listBranches
      tags: [business]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Branch'
    post:
      operationId: createBranch
      tags: [business]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '200':
          description: Already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
  /businesses/{businessId}/terminals:
    parameters:
      - $ref: '#/components/parameters/BusinessIdPath'
    get:
      operationId: listTerminals
      tags: [business]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Terminal'
    post:
      operationId: createTerminal
      tags: [business]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TerminalCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Terminal'
        '200':
          description: Already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Terminal'
  /sync/push:
    post:
      operationId: syncPush
      tags: [sync]
      description: Per-operation results; a duplicate is a success (LLD §7.1, Stage 7).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushRequest'
      responses:
        '200':
          description: Results, one per operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushResponse'
        default:
          $ref: '#/components/responses/Error'
  /sync/pull:
    get:
      operationId: syncPull
      tags: [sync]
      parameters:
        - $ref: '#/components/parameters/BusinessIdQuery'
        - name: stream
          in: query
          required: true
          schema:
            type: string
            enum: [masters, config, documents, control]
        - name: since
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 500
      responses:
        '200':
          description: A page of changes after `since`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullResponse'
        default:
          $ref: '#/components/responses/Error'
  /sync/bootstrap:
    post:
      operationId: syncBootstrap
      tags: [sync]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [businessId]
              properties:
                businessId:
                  type: string
      responses:
        '200':
          description: The snapshot, building or ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
        default:
          $ref: '#/components/responses/Error'
  /sync/bootstrap/{snapshotId}:
    get:
      operationId: getSnapshot
      tags: [sync]
      parameters:
        - name: snapshotId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
        default:
          $ref: '#/components/responses/Error'
  /backups/presign:
    post:
      operationId: presignBackup
      tags: [backups]
      description: A signed device asks to upload an encrypted backup; the reply is a presigned PUT URL for exactly those bytes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackupPresignRequest'
      responses:
        '200':
          description: Where to PUT the object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupUpload'
        default:
          $ref: '#/components/responses/Error'
  /backups/{backupId}/confirm:
    post:
      operationId: confirmBackup
      tags: [backups]
      description: The upload finished; the cloud checks the object's size and SHA-256 and keeps the last 30 per business.
      parameters:
        - name: backupId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The confirmed backup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Backup'
        default:
          $ref: '#/components/responses/Error'
  /backups:
    get:
      operationId: listBackups
      tags: [backups]
      parameters:
        - name: businessId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Confirmed backups, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Backup'
        default:
          $ref: '#/components/responses/Error'
  /backups/{backupId}:
    get:
      operationId: getBackup
      tags: [backups]
      parameters:
        - name: backupId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The backup with a presigned GET URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupDownload'
        default:
          $ref: '#/components/responses/Error'
  /backups/key:
    post:
      operationId: escrowBackupKey
      tags: [backups]
      description: |
        Escrows a business's backup data key (base64, 32 bytes). The cloud stores it wrapped by its master key.
        Idempotent per (businessId, keyId); a different key under an existing keyId is refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackupKey'
      responses:
        '200':
          description: Escrowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupKeyRef'
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: getBackupKey
      tags: [backups]
      description: A member's registered device fetches an escrowed key; without keyId, the business's first key.
      parameters:
        - name: businessId
          in: query
          required: true
          schema:
            type: string
        - name: keyId
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: The data key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupKey'
        default:
          $ref: '#/components/responses/Error'
  /reports/daily:
    get:
      operationId: getDailyReport
      tags: [reports]
      summary: Daily sales, payment and product aggregates and party balances, projected on ingest (8e, ADR-0046)
      parameters:
        - name: businessId
          in: query
          required: true
          schema:
            type: string
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: The business's aggregates for the range; party balances as they stand now
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyReport'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    XServerTime:
      description: Server clock, RFC 3339 UTC
      schema:
        type: string
        format: date-time
  parameters:
    BusinessId:
      name: business_id
      in: query
      required: true
      schema:
        type: string
    BusinessIdPath:
      name: businessId
      in: path
      required: true
      schema:
        type: string
    BusinessIdQuery:
      name: businessId
      in: query
      required: true
      schema:
        type: string
  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, class, message]
          properties:
            code:
              type: string
            class:
              type: string
              enum: [validation, permission, business_rule, conflict, transient, permanent, integrity, auth]
            message:
              type: string
            fields:
              type: object
              additionalProperties:
                type: string
            request_id:
              type: string
    Health:
      type: object
      required: [status, server_time, version, protocol]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        server_time:
          type: string
          format: date-time
        version:
          type: string
        protocol:
          type: integer
    Readiness:
      type: object
      required: [ready, checks]
      properties:
        ready:
          type: boolean
        checks:
          type: array
          items:
            $ref: '#/components/schemas/ReadinessCheck'
    ReadinessCheck:
      type: object
      required: [name, ok]
      properties:
        name:
          type: string
          description: postgres or object_store
        ok:
          type: boolean
    RegisterRequest:
      type: object
      required: [name, identifier, password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        identifier:
          type: string
          description: mobile or email
        password:
          type: string
          minLength: 8
        otp:
          type: string
    RegisterResponse:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: string
    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
        password:
          type: string
        installation_id:
          type: string
          description: present when logging in from the desktop app
    TokenPair:
      type: object
      required: [access_token, refresh_token, expires_in, token_type]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          description: seconds
        token_type:
          type: string
          enum: [Bearer]
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    User:
      type: object
      required: [id, name, identifier]
      properties:
        id:
          type: string
        name:
          type: string
        identifier:
          type: string
        email:
          type: string
        mobile:
          type: string
    Grant:
      type: object
      required: [permission]
      properties:
        permission:
          type: string
        limit:
          type: object
          properties:
            max_discount_bp:
              type: integer
            max_refund_paise:
              type: integer
              format: int64
            backdate_days:
              type: integer
    PermissionSnapshot:
      type: object
      required: [perm_ver, roles, grants, issued_at]
      properties:
        perm_ver:
          type: integer
        roles:
          type: array
          items:
            type: string
        grants:
          type: array
          items:
            $ref: '#/components/schemas/Grant'
        issued_at:
          type: string
          format: date-time
    OfflinePolicy:
      type: object
      required: [max_offline_days, pin_max_attempts, pin_lockout_seconds]
      properties:
        max_offline_days:
          type: integer
        pin_max_attempts:
          type: integer
        pin_lockout_seconds:
          type: integer
    Membership:
      type: object
      required: [organization_id, business_id, roles, permission_snapshot]
      properties:
        organization_id:
          type: string
        business_id:
          type: string
        business_name:
          type: string
        roles:
          type: array
          items:
            type: string
        permission_snapshot:
          $ref: '#/components/schemas/PermissionSnapshot'
    Organization:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    Me:
      type: object
      required: [user, organizations, memberships, offline_policy, server_time]
      properties:
        user:
          $ref: '#/components/schemas/User'
        organizations:
          type: array
          description: organizations the user belongs to; the first is the default for new businesses
          items:
            $ref: '#/components/schemas/Organization'
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
        offline_policy:
          $ref: '#/components/schemas/OfflinePolicy'
        server_time:
          type: string
          format: date-time
    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/TokenPair'
        - $ref: '#/components/schemas/Me'
    DeviceRegisterRequest:
      type: object
      required: [installation_id, public_key, platform, app_version, schema_version]
      properties:
        installation_id:
          type: string
        business_id:
          type: string
          description: optional until a business exists
        public_key:
          type: string
          description: base64 Ed25519 public key
        machine_fingerprint:
          type: string
        platform:
          type: string
        app_version:
          type: string
        schema_version:
          type: integer
        name:
          type: string
    Device:
      type: object
      required: [id, installation_id, status, created_at]
      properties:
        id:
          type: string
        business_id:
          type: string
        installation_id:
          type: string
        name:
          type: string
        platform:
          type: string
        app_version:
          type: string
        schema_version:
          type: integer
        status:
          type: string
          enum: [active, suspended, revoked]
        last_seen_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    BusinessCreate:
      type: object
      required: [id, name, business_type, state_code, tax_scheme]
      properties:
        id:
          type: string
          description: client-minted ULID; server is idempotent on it
        name:
          type: string
        legal_name:
          type: string
        business_type:
          type: string
          enum: [retail, wholesale, distribution, service, restaurant, trading, other]
        address_line1:
          type: string
        address_line2:
          type: string
        city:
          type: string
        state_code:
          type: string
          pattern: '^[0-9]{2}$'
        pin_code:
          type: string
        phone:
          type: string
        email:
          type: string
        gstin:
          type: string
        pan:
          type: string
        tax_scheme:
          type: string
          enum: [regular, composition, unregistered]
        fy_start_month:
          type: integer
          default: 4
    BusinessUpdate:
      allOf:
        - $ref: '#/components/schemas/BusinessCreate'
        - type: object
          required: [version]
          properties:
            version:
              type: integer
              description: optimistic concurrency
    Business:
      allOf:
        - $ref: '#/components/schemas/BusinessCreate'
        - type: object
          required: [organization_id, version, created_at, updated_at]
          properties:
            organization_id:
              type: string
            version:
              type: integer
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    BranchCreate:
      type: object
      required: [id, code, name, state_code]
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
        address_line1:
          type: string
        city:
          type: string
        state_code:
          type: string
        gstin:
          type: string
        is_default:
          type: boolean
    Branch:
      allOf:
        - $ref: '#/components/schemas/BranchCreate'
        - type: object
          required: [business_id, version, created_at]
          properties:
            business_id:
              type: string
            version:
              type: integer
            created_at:
              type: string
              format: date-time
    TerminalCreate:
      type: object
      required: [id, branch_id, code, name]
      properties:
        id:
          type: string
        branch_id:
          type: string
        code:
          type: string
        name:
          type: string
        device_id:
          type: string
    Terminal:
      allOf:
        - $ref: '#/components/schemas/TerminalCreate'
        - type: object
          required: [business_id, version, created_at]
          properties:
            business_id:
              type: string
            version:
              type: integer
            created_at:
              type: string
              format: date-time
    PushOperation:
      type: object
      required: [operationId, seq, entityType, entityId, operationType, dependsOn, payloadHash, payload]
      properties:
        operationId: { type: string }
        seq: { type: integer, format: int64 }
        entityType: { type: string }
        entityId: { type: string }
        operationType: { type: string, enum: [create, update, cancel, void] }
        dependsOn: { type: string, nullable: true }
        payloadHash: { type: string }
        payload: { type: object, additionalProperties: true }
    PushRequest:
      type: object
      required: [businessId, protocol, schemaVersion, clientTime, operations]
      properties:
        businessId: { type: string }
        protocol: { type: integer }
        schemaVersion: { type: integer }
        clientTime: { type: string, format: date-time }
        operations:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/PushOperation' }
    SyncError:
      type: object
      required: [code, class, detail]
      properties:
        code: { type: string }
        class: { type: string, description: 'transient | permanent | dependency' }
        detail: { type: string }
    PushResult:
      type: object
      required: [operationId, status]
      properties:
        operationId: { type: string }
        status: { type: string, enum: [applied, duplicate, rejected, deferred] }
        serverSeq: { type: integer, format: int64 }
        error: { $ref: '#/components/schemas/SyncError' }
    PushResponse:
      type: object
      required: [serverTime, nextPullSeq, results]
      properties:
        serverTime: { type: string, format: date-time }
        nextPullSeq: { type: integer, format: int64 }
        results:
          type: array
          items: { $ref: '#/components/schemas/PushResult' }
    Change:
      type: object
      required: [seq, stream, entityType, entityId, op, version, originDeviceId, payload]
      properties:
        seq: { type: integer, format: int64 }
        stream: { type: string, enum: [masters, config, documents, control] }
        entityType: { type: string }
        entityId: { type: string }
        op: { type: string, enum: [upsert, delete] }
        version: { type: integer }
        originDeviceId: { type: string, nullable: true }
        payload: { type: object, additionalProperties: true }
    PullResponse:
      type: object
      required: [changes, nextSeq, hasMore, serverTime]
      properties:
        changes:
          type: array
          items: { $ref: '#/components/schemas/Change' }
        nextSeq: { type: integer, format: int64 }
        hasMore: { type: boolean }
        serverTime: { type: string, format: date-time }
    Snapshot:
      type: object
      required: [snapshotId, status]
      properties:
        snapshotId: { type: string }
        status: { type: string, enum: [building, ready, failed] }
        url: { type: string }
        asOfSeq: { type: integer, format: int64 }
        bytes: { type: integer, format: int64 }
        expiresAt: { type: string, format: date-time }
    BackupPresignRequest:
      type: object
      required: [businessId, bytes, sha256, keyId, schemaVersion]
      properties:
        businessId: { type: string }
        bytes: { type: integer, format: int64, description: Size of the encrypted object }
        sha256: { type: string, description: Lowercase hex SHA-256 of the encrypted object }
        keyId: { type: string, description: Which escrowed data key encrypted it }
        schemaVersion: { type: integer }
    BackupUpload:
      type: object
      required: [backupId, url, expiresAt]
      properties:
        backupId: { type: string }
        url: { type: string }
        expiresAt: { type: string, format: date-time }
    Backup:
      type: object
      required: [backupId, businessId, deviceId, bytes, sha256, keyId, schemaVersion, createdAt]
      properties:
        backupId: { type: string }
        businessId: { type: string }
        deviceId: { type: string }
        bytes: { type: integer, format: int64 }
        sha256: { type: string }
        keyId: { type: string }
        schemaVersion: { type: integer }
        createdAt: { type: string, format: date-time }
        confirmedAt: { type: string, format: date-time }
    BackupDownload:
      allOf:
        - $ref: '#/components/schemas/Backup'
        - type: object
          required: [url, expiresAt]
          properties:
            url: { type: string }
            expiresAt: { type: string, format: date-time }
    BackupKey:
      type: object
      required: [businessId, keyId, key]
      properties:
        businessId: { type: string }
        keyId: { type: string }
        key: { type: string, description: base64 of the 32-byte AES-256 data key }
    BackupKeyRef:
      type: object
      required: [businessId, keyId]
      properties:
        businessId: { type: string }
        keyId: { type: string }
    DailyReport:
      type: object
      required: [businessId, from, to, sales, payments, products, parties]
      properties:
        businessId: { type: string }
        from: { type: string, format: date }
        to: { type: string, format: date }
        sales:
          type: array
          items: { $ref: '#/components/schemas/DailySales' }
        payments:
          type: array
          items: { $ref: '#/components/schemas/DailyPayment' }
        products:
          type: array
          items: { $ref: '#/components/schemas/ProductSalesDaily' }
        parties:
          type: array
          items: { $ref: '#/components/schemas/PartyOutstanding' }
    DailySales:
      type: object
      required: [branchId, day, saleCount, saleTaxablePaise, saleTaxPaise, saleTotalPaise, saleCogsPaise, returnCount, returnTaxablePaise, returnTaxPaise, returnTotalPaise, returnCostPaise]
      properties:
        branchId: { type: string }
        day: { type: string }
        saleCount: { type: integer, format: int64 }
        saleTaxablePaise: { type: integer, format: int64 }
        saleTaxPaise: { type: integer, format: int64 }
        saleTotalPaise: { type: integer, format: int64 }
        saleCogsPaise: { type: integer, format: int64 }
        returnCount: { type: integer, format: int64 }
        returnTaxablePaise: { type: integer, format: int64 }
        returnTaxPaise: { type: integer, format: int64 }
        returnTotalPaise: { type: integer, format: int64 }
        returnCostPaise: { type: integer, format: int64 }
    DailyPayment:
      type: object
      required: [branchId, day, flow, method, docCount, amountPaise]
      properties:
        branchId: { type: string }
        day: { type: string }
        flow: { type: string, description: 'sale, refund, receipt, payment or expense' }
        method: { type: string }
        docCount: { type: integer, format: int64 }
        amountPaise: { type: integer, format: int64 }
    ProductSalesDaily:
      type: object
      required: [branchId, day, productId, soldQtyMilli, soldTaxablePaise, soldCogsPaise, returnedQtyMilli, returnedTaxablePaise, returnedCostPaise]
      properties:
        branchId: { type: string }
        day: { type: string }
        productId: { type: string }
        soldQtyMilli: { type: integer, format: int64 }
        soldTaxablePaise: { type: integer, format: int64 }
        soldCogsPaise: { type: integer, format: int64 }
        returnedQtyMilli: { type: integer, format: int64 }
        returnedTaxablePaise: { type: integer, format: int64 }
        returnedCostPaise: { type: integer, format: int64 }
    PartyOutstanding:
      type: object
      required: [partyType, partyId, balancePaise]
      properties:
        partyType: { type: string }
        partyId: { type: string }
        balancePaise: { type: integer, format: int64, description: positive = the party owes the business }
