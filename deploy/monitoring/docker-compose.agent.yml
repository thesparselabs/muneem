# The log agent (ADR-0053): Grafana Alloy ships this VM's api, caddy and crash container logs to Loki. Run it on the API
# VM and on the monitoring VM: `docker compose -f docker-compose.agent.yml --env-file .env up -d`.
name: muneem-agent
services:
  alloy:
    image: grafana/alloy:v1.10.2
    restart: unless-stopped
    command: ["run", "--server.http.listen-addr=127.0.0.1:12345", "--storage.path=/var/lib/alloy", "/etc/alloy/config.alloy"]
    environment:
      LOKI_URL: ${LOKI_URL:?}           # http://<monitoring VM private address>:3100/loki/api/v1/push
      MUNEEM_HOST: ${MUNEEM_HOST:?}     # this VM's name, as the host label
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }
volumes:
  alloy_data:
