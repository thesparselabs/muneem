apiVersion: 1
contactPoints:
  - orgId: 1
    name: ops
    receivers:
      - uid: muneem-ops-email
        type: email
        settings:
          addresses: ${MUNEEM_ALERT_EMAIL}
          singleEmail: true
policies:
  - orgId: 1
    receiver: ops
    group_by: [alertname, business_id]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: ops
        object_matchers:
          - [severity, "=", critical]
        repeat_interval: 1h
