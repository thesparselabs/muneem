# Monitoring (ADR-0053): Prometheus, Loki, Grafana and the crash collector, on a small VM of their own (or beside the
# API on one VM). Every ${VAR} comes from deploy/monitoring/.env (see .env.example). Run the agent compose
# (docker-compose.agent.yml) on every VM whose container logs should reach Loki, this one included.
name: muneem-monitoring
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/targets:/etc/prometheus/targets:ro   # api.yml: where the API's metrics port is reachable
      - prometheus_data:/prometheus
    extra_hosts: ["host.docker.internal:host-gateway"]  # same-VM installs scrape the API through the docker bridge
    expose: ["9090"]
    logging: &logging
      driver: json-file
      options: { max-size: "20m", max-file: "3" }
  loki:
    image: grafana/loki:3.5.5
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    # Agents on other VMs push here over the private network only; never bind it to a public address.
    ports: ["${LOKI_BIND:-127.0.0.1}:3100:3100"]
    logging: *logging
  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    depends_on: [prometheus, loki]
    environment:
      GF_SERVER_ROOT_URL: https://${GRAFANA_DOMAIN:?}/
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SMTP_ENABLED: ${GRAFANA_SMTP_ENABLED:-false}
      GF_SMTP_HOST: ${GRAFANA_SMTP_HOST:-}
      GF_SMTP_USER: ${GRAFANA_SMTP_USER:-}
      GF_SMTP_PASSWORD: ${GRAFANA_SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${GRAFANA_SMTP_FROM:-}
      MUNEEM_ALERT_EMAIL: ${MUNEEM_ALERT_EMAIL:?}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    expose: ["3000"]
    logging: *logging
  crash:
    # The API image's crash-collector subcommand: Sentry store/envelope/minidump ingest, scrubbed, logged for Loki.
    image: ${MUNEEM_IMAGE:?}:${MUNEEM_TAG:?}
    command: ["crash-collector"]
    restart: unless-stopped
    environment:
      MUNEEM_CRASH_KEY: ${MUNEEM_CRASH_KEY:?}
      MUNEEM_CRASH_DIR: /var/lib/muneem-crash
      PORT: "8081"
    volumes:
      - crash_dumps:/var/lib/muneem-crash
    healthcheck:
      disable: true   # the image's healthcheck probes the API's /v1/ready
    expose: ["8081"]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    logging: *logging
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on: [grafana, crash]
    ports: ["80:80", "443:443"]
    environment:
      GRAFANA_DOMAIN: ${GRAFANA_DOMAIN:?}
      CRASH_DOMAIN: ${CRASH_DOMAIN:?}
      ACME_EMAIL: ${ACME_EMAIL:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *logging
volumes:
  prometheus_data:
  loki_data:
  grafana_data:
  crash_dumps:
  caddy_data:
  caddy_config:
