# Local development infrastructure only. Production uses managed services.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: muneem
      POSTGRES_PASSWORD: muneem
      POSTGRES_DB: muneem
    ports: ["5433:5432"]   # 5433 on the host: avoids clashing with a locally installed Postgres
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muneem"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata:
