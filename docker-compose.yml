# Local development infrastructure only. Production uses managed services.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: muneem
      POSTGRES_PASSWORD: muneem
      POSTGRES_DB: muneem
    ports: ["5433:5432"]   # 5433 on the host: avoids clashing with a locally installed Postgres
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muneem"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:                   # hydration bundles (Stage 7f); minio/minio is no longer on Docker Hub
    image: bitnamilegacy/minio:2025.5.24
    environment:
      MINIO_ROOT_USER: muneem
      MINIO_ROOT_PASSWORD: muneem-dev-secret
      MINIO_DEFAULT_BUCKETS: muneem-snapshots
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/bitnami/minio/data"]
volumes:
  pgdata:
  miniodata:
