name: promote
# Moves an already-built release between channels, or changes its rollout, without rebuilding (ADR-0056):
# the bytes beta ran are the bytes stable gets. Rollout 0 halts; from = to changes the percentage in place;
# from "archive" re-publishes any earlier version (rollback).
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 1.4.0'
        type: string
        required: true
      from:
        description: 'Source: a channel that serves this version now, or archive (releases/<version>/)'
        type: choice
        options: [beta, dev, stable, archive]
        default: beta
      to:
        description: 'Channel to publish to'
        type: choice
        options: [stable, beta, dev]
        default: stable
      rollout:
        description: 'Rollout percentage, 0–100 (0 halts)'
        type: number
        required: true
        default: 10

permissions:
  contents: read

concurrency:
  group: promote-${{ inputs.to }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      FROM: ${{ inputs.from }}
      TO: ${{ inputs.to }}
      ROLLOUT: ${{ inputs.rollout }}
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      UPDATES_S3_BUCKET: ${{ vars.UPDATES_S3_BUCKET }}
      UPDATES_S3_ENDPOINT: ${{ vars.UPDATES_S3_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.UPDATES_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.UPDATES_S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.UPDATES_S3_REGION || 'auto' }}
    steps:
      - name: update host configured
        run: |
          [[ -n "$UPDATES_S3_BUCKET" && -n "$AWS_SECRET_ACCESS_KEY" ]] || { echo "::error::UPDATES_S3_* are not set"; exit 1; }
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6   # version comes from package.json packageManager
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run gen build --filter=@muneem/contracts
      - name: fetch the source release
        run: |
          endpoint=(); [[ -n "$UPDATES_S3_ENDPOINT" ]] && endpoint=(--endpoint-url "$UPDATES_S3_ENDPOINT")
          src="releases/$VERSION"; [[ "$FROM" == "archive" ]] || src="$FROM"
          aws s3 cp "s3://$UPDATES_S3_BUCKET/releases/$VERSION/build-info.json" build-info.json "${endpoint[@]}"
          aws s3 cp "s3://$UPDATES_S3_BUCKET/$src/" source/ --recursive --no-progress "${endpoint[@]}" \
            --exclude '*' --include latest.yml --include "*-$VERSION.exe" --include "*-$VERSION.exe.blockmap"
          if [[ "$TO" == "stable" && "$(jq -r .signed build-info.json)" != "true" ]]; then
            echo "::error::$VERSION is unsigned; an unsigned build never goes to stable."
            exit 1
          fi
      - name: rewrite latest.yml for the target channel
        run: pnpm release:promote --from source --version "$VERSION" --channel "$TO" --rollout "$ROLLOUT" --out out
      - name: publish
        run: bash scripts/release-upload.sh "out/$TO" "$TO"
      - name: summary
        run: |
          {
            echo "### $VERSION: $FROM → $TO at $ROLLOUT%"
            echo '```yaml'; cat "out/$TO/latest.yml"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
