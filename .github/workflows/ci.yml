name: ci
on:
  push: { branches: [main] }
  pull_request:
  schedule:
    - cron: '30 21 * * *'   # nightly 03:00 IST: differential fuzz + soak-style runs
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6   # version comes from package.json packageManager
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run gen build typecheck lint test
      - run: pnpm schema-lint
  docs:
    # A code change must be recorded in docs/CHANGELOG.md with what changed and why (see CLAUDE.md).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: changelog updated when code changed
        run: |
          base="origin/${{ github.base_ref }}"
          changed=$(git diff --name-only "$base"...HEAD)
          if echo "$changed" | grep -qE '^(apps|packages|cloud|scripts)/' && ! echo "$changed" | grep -q '^docs/CHANGELOG.md$'; then
            echo "::error::code changed under apps/, packages/, cloud/ or scripts/ but docs/CHANGELOG.md was not updated (what + why)."
            exit 1
          fi
          echo "docs check ok"
  go:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: cloud } }
    services:
      postgres:            # sync ingest/pull integration tests and the protocol fixtures (Stage 7b/7c)
        image: postgres:16-alpine
        env: { POSTGRES_USER: muneem, POSTGRES_PASSWORD: muneem, POSTGRES_DB: muneem }
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U muneem" --health-interval 5s --health-timeout 3s --health-retries 10
      minio:               # hydration bundles (Stage 7f); the bitnami image starts the server without a command
        image: bitnamilegacy/minio:2025.5.24
        env: { MINIO_ROOT_USER: muneem, MINIO_ROOT_PASSWORD: muneem-dev-secret }
        ports: ['9000:9000']
        options: >-
          --health-cmd "curl -fs http://localhost:9000/minio/health/live" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      MUNEEM_TEST_DATABASE_URL: postgres://muneem:muneem@localhost:5433/muneem?sslmode=disable
      MUNEEM_TEST_S3_ENDPOINT: http://localhost:9000
      MUNEEM_TEST_S3_ACCESS_KEY: muneem
      MUNEEM_TEST_S3_SECRET_KEY: muneem-dev-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: cloud/go.mod, cache-dependency-path: cloud/go.sum }
      - run: make gen          # api/openapi.gen.go is generated from packages/contracts/openapi (gitignored)
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...     # loads packages/domain/fixtures — the cross-language contract
  diff-fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [node, go]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6   # version comes from package.json packageManager
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - uses: actions/setup-go@v7
        with: { go-version-file: cloud/go.mod, cache-dependency-path: cloud/go.sum }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @muneem/domain build
      - run: make -C cloud gen
      - run: pnpm diff-fuzz --n 20000
