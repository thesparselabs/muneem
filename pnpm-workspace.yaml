packages:
  - "packages/*"
  - "apps/*"
# pnpm 11: dependencies allowed to run install scripts (native builds / binary downloads)
allowBuilds:
  esbuild: true
  better-sqlite3: true
  electron: true
  electron-winstaller: true
  "@node-rs/argon2": true
  "@swc/core": true

# Security: exceljs pulls a uuid with a missing bounds check (GHSA, fixed in 11.1.1).
overrides:
  'uuid@<11.1.1': '^11.1.1'
