appId: app.muneem.desktop
productName: Muneem
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - native/**
  - package.json
# Receipt fonts for ₹ and Indic raster lines (OFL 1.1, licence beside them; ADR-0055).
extraResources:
  - from: resources/fonts
    to: fonts
asarUnpack:
  - native/**
  - "**/*.node"
npmRebuild: false
win:
  target:
    - target: nsis
      arch: [x64]
  # Signing (EV / Azure Trusted Signing) is configured in CI via env, never committed. Its publisher name lands in
  # app-update.yml, and electron-updater refuses an update whose Authenticode signer differs (ADR-0049).
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
# The app points the feed at <host>/<channel> at run time (ADR-0049); this is the default the build records.
publish:
  provider: generic
  url: https://updates.muneem.app/stable
